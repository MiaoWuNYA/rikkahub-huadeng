name: Build APK

on:
  push:
    branches: [ master, mingli, huadeng ]
  workflow_dispatch:

jobs:
  build:
    # 老 fork MiaoWuNYA/rikkahub-plus 已归档，只在新仓库构建
    if: github.repository == 'MiaoWuNYA/rikkahub-huadeng'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Upgrade pip & setuptools
        run: pip install --upgrade pip setuptools wheel
      - name: Force full Python reinstall (auto-update all packages)
        run: rm -rf app/build/python $HOME/.gradle/caches/chaquopy*
      - name: Pre-install setuptools for build
        run: pip install --upgrade pip setuptools wheel 2>&1 | tail -3
      - name: Write signing config
        run: |
          cat > local.properties << 'EOF'
          storeFile=app.key
          storePassword=android
          keyAlias=androiddebugkey
          keyPassword=android
          EOF
      - name: Build
        run: |
          chmod +x gradlew
          rm -rf app/build/python/  # 清理之前失败构建的脏缓存
          ./gradlew assembleRelease -x :web:buildWebUi --no-build-cache --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: rikkahub-plus-fresh
          path: app/build/outputs/apk/release/*arm64-v8a*.apk
